<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <h1>Calculator</h1>
    <main>
        <div class="calculator">
            <div class="display-field">
                <output id="display" class="display" aria-live="polite">
                    0
                </output>
            </div>

            <div class="buttons">
                <button type="button" data-number="7">7</button>
                <button type="button" data-number="8">8</button>
                <button type="button" data-number="9">9</button>
                <button type="button" data-operator="/" aria-label="devide by">/</button>

                <button type="button" data-number="4">4</button>
                <button type="button" data-number="5">5</button>
                <button type="button" data-number="6">6</button>
                <button type="button" data-operator="*" aria-label="multiply">X</button>

                <button type="button" data-number="1">1</button>
                <button type="button" data-number="2">2</button>
                <button type="button" data-number="3">3</button>
                <button type="button" data-operator="-" aria-label="minus">-</button>

                <button type="button" data-number="0">0</button>
                <button type="button" data-clear>Clear</button>
                <button type="button" data-equals aria-label>=</button>
                <button type="button" data-operator="+" aria-label="plus">+</button>
            </div>

        </div>


    </main>
    <script src="javascript.js"></script>
</body>
</html>
